                                    <h4 class="font-semibold text-white mb-3 flex items-center gap-2"><i class="fa-solid fa-ban text-[#d4af37]"></i> Guest Policies</h4>
                                    <ul class="text-sm text-gray-400 space-y-2">
                                        <li><i class="fa-solid fa-check text-green-500 mr-2 w-4"></i> Outside food and beverages are permitted</li>
                                        <li><i class="fa-solid fa-check text-green-500 mr-2 w-4"></i> Smoking permitted only in designated outdoor areas</li>
                                        <li><i class="fa-solid fa-xmark text-red-500 mr-2 w-4"></i> Pets are not allowed</li>
                                        <li><i class="fa-solid fa-xmark text-red-500 mr-2 w-4"></i> Loud music and parties after 10:00 PM are prohibited</li>
                                        <li><i class="fa-solid fa-xmark text-red-500 mr-2 w-4"></i> Unregistered guests cannot stay overnight</li>
                                        ${villa.dateChangeNoPenalty ? '<li><i class="fa-solid fa-check text-green-500 mr-2 w-4"></i> Villa/date changes carry no penalty, subject to availability and full booking payment</li>' : ''}
                                    </ul>
                                </div>

                                <div class="bg-gray-900/50 rounded-xl p-5 border border-gray-800">
                                    <h4 class="font-semibold text-white mb-3 flex items-center gap-2"><i class="fa-solid fa-champagne-glasses text-[#d4af37]"></i> Dining Services</h4>
                                    <p class="text-sm text-gray-400">${villa.foodPrice ? `Food package: ₹${Number(villa.foodPrice).toLocaleString("en-IN")} per person. Includes ${villa.foodIncludes}.` : "In-house chef services available at additional cost. Please inform us of any dietary restrictions in advance. Outside catering is also permitted."}</p>
                                </div>
                            </div>
                        </div>

                        <!-- Cancellation Policy -->
                        <div>
                            <h3 class="serif text-2xl text-[#d4af37] mb-4 border-b border-gray-800 pb-2 flex items-center gap-2">
                                <i class="fa-regular fa-calendar-xmark"></i> Cancellation Policy
                            </h3>
                            <div class="space-y-2 text-sm text-gray-400">
                                ${cancellationPolicyHTML}
                            </div>
                        </div>
                    </div>

                    <!-- Booking Card - WhatsApp Only -->
                    <div class="lg:col-span-1">
                        <div class="glass-card rounded-2xl p-6 md:p-7 sticky top-28 shadow-2xl">
                            <div class="text-center mb-5">
                                <span class="text-[#d4af37] text-xs font-bold tracking-widest uppercase">Limited Availability</span>
                                <div class="mt-4">
                                    ${priceDisplay}
                                    ${foodPackageHTML}
                                </div>
                            </div>
                            
                            <div class="bg-gray-800/30 rounded-xl p-4 mb-6">
                                <div class="flex justify-between text-sm py-2 border-b border-gray-700">
                                    <span class="text-gray-400">Security Deposit</span>
                                    <span class="text-white font-medium">₹${securityDepositValue} (100% Refundable)</span>
                                </div>
                                <div class="flex justify-between text-sm py-2 border-b border-gray-700">
                                    <span class="text-gray-400">${capacityLabel}</span>
                                    <span class="text-white font-medium">${capacityDisplay}</span>
                                </div>
                                <div class="flex justify-between text-sm py-2">
                                    <span class="text-gray-400">Extra Guest</span>
                                    <span class="text-white font-medium">₹${extraGuestFeeValue}/person (subject to capacity)</span>
                                </div>
                            </div>
                            
                            <p class="text-xs text-gray-500 mb-6 text-center">For bookings and availability, our concierge team is just a message away.</p>
                            
                            <a href="${whatsappUrl}" target="_blank" rel="noopener noreferrer"
                               class="block w-full bg-[#25D366] hover:bg-[#1ebe5d] text-white text-center font-bold py-4 rounded-xl transition duration-300 shadow-lg flex items-center justify-center gap-3 group">
                                <i class="fa-brands fa-whatsapp text-2xl group-hover:scale-110 transition"></i> 
                                <span>Inquire on WhatsApp</span>
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderNotFoundError() {
            mainContent.innerHTML = `
                <div class="flex flex-col items-center justify-center h-[60vh] text-center px-4">
                    <i class="fa-regular fa-building text-6xl text-gray-700 mb-6"></i>
                    <h2 class="serif text-3xl text-white mb-4">Villa Not Found</h2>
                    <p class="text-gray-400 mb-8 max-w-md">The property you're looking for may have been removed or the link is invalid.</p>
                    <a href="villa-list.html" class="bg-[#d4af37] text-black px-8 py-3 font-bold uppercase tracking-widest text-xs rounded-full hover:bg-yellow-500 transition shadow-lg">Browse Our Collection</a>
                </div>
            `;
        }

        // Gallery Functions
        function openGallery(index = 0) {
            currentImageIndex = index;
            renderGalleryThumbStrip();
            updateModalImage();
            galleryModal.classList.remove('hidden');
            galleryModal.classList.add('flex');
            document.body.style.overflow = 'hidden';
            document.getElementById('galleryThumbStrip')?.querySelector('[data-gallery-index="' + index + '"]')?.scrollIntoView({ block: 'nearest', inline: 'center' });
        }

        function renderGalleryThumbStrip() {
            const strip = document.getElementById('galleryThumbStrip');
            if (!strip) return;
            strip.innerHTML = activeGalleryImages.map((src, idx) =>
                '<button type="button" data-gallery-index="' + idx + '" onclick="goToGalleryImage(' + idx + ')" aria-label="Show photo ' + (idx + 1) + '" class="gallery-thumb shrink-0 w-16 h-14 md:w-20 md:h-16 overflow-hidden rounded-lg border-2 border-transparent bg-gray-900"><img src="' + src + '" loading="lazy" decoding="async" class="w-full h-full object-cover" alt=""></button>'
            ).join('');
            updateGalleryThumbSelection();
        }

        function goToGalleryImage(index) {
            currentImageIndex = index;
            updateModalImage();
            updateGalleryThumbSelection();
        }

        function updateGalleryThumbSelection() {
            const strip = document.getElementById('galleryThumbStrip');
            if (!strip) return;
            strip.querySelectorAll('[data-gallery-index]').forEach((button) => {
                const active = Number(button.dataset.galleryIndex) === currentImageIndex;
                button.classList.toggle('border-[#d4af37]', active);
                button.classList.toggle('border-transparent', !active);
                if (active) button.scrollIntoView({ block: 'nearest', inline: 'center' });
            });
        }

        function closeGallery() {
            galleryModal.classList.add('hidden');
            galleryModal.classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        function changeImage(step) {
            currentImageIndex += step;
            if (currentImageIndex >= activeGalleryImages.length) currentImageIndex = 0;
            else if (currentImageIndex < 0) currentImageIndex = activeGalleryImages.length - 1;
            updateModalImage();
            updateGalleryThumbSelection();
        }

        function updateModalImage() {
            const nextSrc = activeGalleryImages[currentImageIndex];
            if (!modalMainImage) return;
            modalMainImage.style.opacity = '0';
            modalMainImage.onload = () => { modalMainImage.style.opacity = '1'; };
            modalMainImage.onerror = () => {
                modalMainImage.onerror = null;
                modalMainImage.src = 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1200';
                modalMainImage.style.opacity = '1';
            };
            modalMainImage.src = nextSrc;
            if (galleryCount) galleryCount.innerText = `${currentImageIndex + 1} / ${activeGalleryImages.length}`;
            if (modalMainImage.complete) modalMainImage.style.opacity = '1';
        }

        // Native touch swipe controls for mobile photo browsing.
        let galleryTouchStartX = 0;
        let galleryTouchStartY = 0;
        galleryModal?.addEventListener('touchstart', (event) => {
            if (!event.touches || event.touches.length !== 1) return;
            galleryTouchStartX = event.touches[0].clientX;
            galleryTouchStartY = event.touches[0].clientY;
        }, { passive: true });
        galleryModal?.addEventListener('touchend', (event) => {
            if (!event.changedTouches || !event.changedTouches.length) return;
            const dx = event.changedTouches[0].clientX - galleryTouchStartX;
            const dy = event.changedTouches[0].clientY - galleryTouchStartY;
            if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.25) changeImage(dx < 0 ? 1 : -1);
        }, { passive: true });

        document.addEventListener('keydown', (e) => {
            if (galleryModal && !galleryModal.classList.contains('hidden')) {
                if (e.key === 'ArrowRight') changeImage(1);
                if (e.key === 'ArrowLeft') changeImage(-1);
                if (e.key === 'Escape') closeGallery();
            }
        });

        window.onload = function() {
            loadVillaData();
        };
    </script>
    <script src="public/villago-theme.js?v=gallery-collage-20261102" defer></script>
</body>
</html>
